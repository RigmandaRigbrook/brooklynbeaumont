  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

	body {
	  background: linear-gradient(180deg, #7a6fd1 0%, #f8c9b1 100%);
	  background-image: var(--sf-img-20);
	  background-repeat: no-repeat;
	  background-size: cover;
	  background-attachment: fixed;
}

    #video {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      z-index: 1;
    }

    #title {
      position: fixed;
      top: 20%;
      width: 100%;
      text-align: center;
      font-size: 3rem;
      opacity: 0;
      animation: fadeTitle 6s ease-in-out forwards;
      z-index: 2;
    }

    @keyframes fadeTitle {
      0% { opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

	#skip {
	  position: fixed;
	  bottom: 2rem;
	  right: 2rem;
	  z-index: 3;
	}
	
	
  </style>
</head>

<body>
		<div id="title" class="md:order-1">
		  <h1 class="h1 text-center">
			Huckleberry Dreaming
		  </h1>
		</div>

  <video autoplay id="video" muted playsinline>
    <source src="assets/intro.mp4" type="video/mp4">
  </video>

  <button id="skip" class="btn w-full sm:w-auto mb-2 sm:mb-0 sm:mr-2" style="position:fixed; bottom:2rem; right:2rem; z-index:3;">
      Skip Intro
  </button>

  <script>
    const video = document.getElementById('video');

    // Force autoplay
    video.muted = true;
    video.play().catch(() => {
      setTimeout(() => video.play(), 180);
    });

    // Skip button
    document.getElementById('skip').addEventListener('click', () => {
      fadeOutAndRedirect();
    });

    // End of video → fade out → redirect
    video.addEventListener('ended', fadeOutAndRedirect);

    function fadeOutAndRedirect() {
      document.body.style.opacity = "0";
      setTimeout(() => {
        window.location.href = "home.html";
      }, 1000);
    }
  </script>
</body>
</html>
